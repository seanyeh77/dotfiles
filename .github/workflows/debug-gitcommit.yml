name: debug gitcommit on debian

# 暫時性的調查 workflow：查完會刪掉
on:
  workflow_dispatch:
  push:
    paths:
      - ci/debug-gitcommit.sh
      - .github/workflows/debug-gitcommit.yml

jobs:
  debug:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 20
    steps:
      - name: deps
        run: apt-get update && apt-get install -y git curl ca-certificates build-essential strace procps
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: /github/home/.cargo
          key: cargo-tree-sitter-debian12-v1
      - name: tree-sitter (cargo, same as install.sh)
        shell: bash
        run: |
          if [ ! -x "$HOME/.cargo/bin/tree-sitter" ]; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            "$HOME/.cargo/bin/cargo" install --locked tree-sitter-cli
          fi
          ln -sf "$HOME/.cargo/bin/tree-sitter" /usr/local/bin/tree-sitter
      - name: experiments
        shell: bash
        run: bash ci/debug-gitcommit.sh
