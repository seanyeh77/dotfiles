name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC: catch breakage from upstream nvim / plugin / LSP updates

jobs:
  # Native runners for each OS / architecture
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04 amd64 + claude, os: ubuntu-24.04, claude: true }
          - { name: ubuntu-24.04 arm64, os: ubuntu-24.04-arm }
          - { name: macos arm64,        os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - name: install.sh
        timeout-minutes: 25
        run: bash install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
        shell: bash -o pipefail {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          INSTALL_CLAUDE: ${{ matrix.claude && '1' || '0' }}
          CLAUDE_PLUGINS: >-
            commit-commands code-review feature-dev security-guidance code-simplifier
            claude-md-management superpowers context7 frontend-design playwright design
            vercel-react-best-practices
      - name: verify
        run: nvim --headless -c "luafile ci/verify.lua" 2>&1 | tee "$RUNNER_TEMP/verify.log"
        shell: bash -o pipefail {0}
      - name: verify tmux
        run: bash ci/verify-tmux.sh 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
        shell: bash -o pipefail {0}
      - name: verify claude
        if: matrix.claude
        run: >-
          bash ci/verify-claude.sh
          commit-commands@claude-plugins-official code-review@claude-plugins-official
          feature-dev@claude-plugins-official security-guidance@claude-plugins-official
          code-simplifier@claude-plugins-official claude-md-management@claude-plugins-official
          superpowers@claude-plugins-official context7@claude-plugins-official
          frontend-design@claude-plugins-official playwright@claude-plugins-official
          design@knowledge-work-plugins skill:vercel-react-best-practices
          2>&1 | tee "$RUNNER_TEMP/verify-claude.log"
        shell: bash -o pipefail {0}
      - name: report failure
        if: failure() || cancelled()
        run: bash ci/annotate.sh "$RUNNER_TEMP"
        shell: bash

  # Other distros run in containers (as root, which also covers the no-sudo path)
  distro:
    name: ${{ matrix.image }}${{ matrix.arch == 'arm64' && ' arm64' || '' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12" }
          - { image: "debian:13" }
          - { image: "debian:12", arch: arm64, rerun: true } # old glibc + arm64, and a re-run
          - { image: "debian:13", arch: arm64 }
          - { image: "ubuntu:22.04", arch: arm64 } # glibc 2.35: the prebuilt tree-sitter refuses to run
          - { image: "ubuntu:22.04" }
          - { image: "fedora:latest" }
          - { image: "rockylinux:9" }
          - { image: "archlinux:latest" }
          - { image: "opensuse/tumbleweed" }
          - { image: "alpine:latest", experimental: true } # musl: some Mason binaries cannot run
    steps:
      # checkout needs git, otherwise there is no .git and install.sh would try to clone again
      - name: bootstrap git
        shell: sh
        run: |
          if   command -v apt-get >/dev/null; then apt-get update && apt-get install -y git
          elif command -v dnf     >/dev/null; then dnf install -y git
          elif command -v pacman  >/dev/null; then pacman -Sy --noconfirm git
          elif command -v zypper  >/dev/null; then zypper --non-interactive install git tar gzip
          elif command -v apk     >/dev/null; then apk add git bash
          fi
      - uses: actions/checkout@v5
      - name: install.sh
        timeout-minutes: 25
        run: bash install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
        shell: bash -o pipefail {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
      # Reproduces a real failure: a Mason tree-sitter that needs glibc 2.39 shadowing the
      # working one on PATH (old env.sh put Mason first), then re-running the installer
      - name: re-run install.sh with a broken Mason tree-sitter first on PATH
        if: matrix.rerun
        timeout-minutes: 25
        shell: bash -o pipefail {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          M="$HOME/.local/share/nvim/mason"
          mkdir -p "$M/bin" "$M/packages/tree-sitter-cli"
          cp /opt/node/lib/node_modules/tree-sitter-cli/tree-sitter "$M/packages/tree-sitter-cli/tree-sitter"
          ln -sf "$M/packages/tree-sitter-cli/tree-sitter" "$M/bin/tree-sitter"
          if "$M/bin/tree-sitter" --version >/dev/null 2>&1; then echo "::warning::planted binary runs here, test is weaker"; fi
          export PATH="$M/bin:$PATH"
          rm -f "$HOME/.local/share/nvim/site/parser/c.so"   # force a parser to compile again
          bash install.sh 2>&1 | tee "$RUNNER_TEMP/install-rerun.log"
          ! grep -q "GLIBC_2.39" "$RUNNER_TEMP/install-rerun.log"
      - name: verify
        run: nvim --headless -c "luafile ci/verify.lua" 2>&1 | tee "$RUNNER_TEMP/verify.log"
        shell: bash -o pipefail {0}
      - name: verify tmux
        run: bash ci/verify-tmux.sh 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
        shell: bash -o pipefail {0}
      - name: report failure
        if: failure() || cancelled()
        run: bash ci/annotate.sh "$RUNNER_TEMP"
        shell: bash

  # Test the exact command users run (main only, since the short URL serves main)
  one-liner:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: curl | bash
        timeout-minutes: 25
        run: curl -fsSL ${{ github.repository_owner }}.github.io/dotfiles | bash 2>&1 | tee "$RUNNER_TEMP/install.log"
        shell: bash -o pipefail {0}
        env:
          DOTFILES_REPO: https://github.com/${{ github.repository }}
      - name: verify
        run: nvim --headless -c "luafile $HOME/dotfiles/ci/verify.lua" 2>&1 | tee "$RUNNER_TEMP/verify.log"
        shell: bash -o pipefail {0}
      - name: verify tmux
        run: bash "$HOME/dotfiles/ci/verify-tmux.sh" 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
        shell: bash -o pipefail {0}
      - name: report failure
        if: failure() || cancelled()
        run: bash "$HOME/dotfiles/ci/annotate.sh" "$RUNNER_TEMP"
