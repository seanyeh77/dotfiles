name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC: catch breakage from upstream nvim / plugin / LSP updates

jobs:
  # Native runners for each OS / architecture
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04 amd64 + claude, os: ubuntu-24.04, claude: true }
          - { name: ubuntu-24.04 arm64, os: ubuntu-24.04-arm }
          - { name: macos arm64,        os: macos-latest, bash: /bin/bash } # macOS's own bash 3.2
    steps:
      - uses: actions/checkout@v5
      # Write the whole PATH: in container jobs GITHUB_PATH rebuilds PATH from the image config,
      # and images without a PATH entry (openSUSE Tumbleweed) end up with only ~/.local/bin
      - name: put ~/.local/bin on PATH (steps do not read ~/.bashrc)
        run: echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
        shell: bash
      - name: install.sh
        timeout-minutes: 25
        run: ${{ matrix.bash || 'bash' }} install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
        shell: bash -o pipefail {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          INSTALL_CLAUDE: ${{ matrix.claude && '1' || '0' }}
          CLAUDE_PLUGINS: >-
            commit-commands code-review feature-dev security-guidance code-simplifier
            claude-md-management superpowers context7 frontend-design playwright design
            vercel-react-best-practices
      - name: verify
        run: nvim --headless -c "luafile ci/verify.lua" 2>&1 | tee "$RUNNER_TEMP/verify.log"
        shell: bash -o pipefail {0}
      - name: verify tmux
        run: bash ci/verify-tmux.sh 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
        shell: bash -o pipefail {0}
      # People also paste the command into zsh (macOS default) or sh: the script must hand over to bash
      - name: started from zsh or sh, the installer hands over to bash
        if: runner.os == 'macOS'
        shell: bash
        run: |
          printf '#!/usr/bin/env bash\necho "ran in bash $BASH_VERSION"\n' > "$RUNNER_TEMP/fake.sh"
          for sh in zsh sh "bash --posix"; do
            out="$(cat install.sh | DOTFILES_URL="file://$RUNNER_TEMP/fake.sh" $sh 2>&1 | tail -1)"
            echo "$sh: $out"; case "$out" in "ran in bash"*) ;; *) exit 1 ;; esac
          done
      - name: verify claude
        if: matrix.claude
        run: >-
          bash ci/verify-claude.sh
          commit-commands@claude-plugins-official code-review@claude-plugins-official
          feature-dev@claude-plugins-official security-guidance@claude-plugins-official
          code-simplifier@claude-plugins-official claude-md-management@claude-plugins-official
          superpowers@claude-plugins-official context7@claude-plugins-official
          frontend-design@claude-plugins-official playwright@claude-plugins-official
          design@knowledge-work-plugins skill:vercel-react-best-practices
          2>&1 | tee "$RUNNER_TEMP/verify-claude.log"
        shell: bash -o pipefail {0}
      - name: report failure
        if: failure() || cancelled()
        run: bash ci/annotate.sh "$RUNNER_TEMP"
        shell: bash

  # Other distros run in containers (as root, which also covers the no-sudo path)
  distro:
    name: ${{ matrix.image }}${{ matrix.arch == 'arm64' && ' arm64' || '' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12" }
          - { image: "debian:13" }
          - { image: "debian:12", arch: arm64, rerun: true } # old glibc + arm64, and a re-run
          - { image: "debian:13", arch: arm64 }
          - { image: "ubuntu:22.04", arch: arm64 } # glibc 2.35: the prebuilt tree-sitter refuses to run
          - { image: "ubuntu:22.04" }
          - { image: "fedora:latest" }
          - { image: "rockylinux:9" }
          - { image: "archlinux:latest" }
          - { image: "opensuse/tumbleweed" }
          - { image: "alpine:latest", experimental: true } # musl: some Mason binaries cannot run
    steps:
      # checkout needs git, otherwise there is no .git and install.sh would try to clone again
      - name: bootstrap git
        shell: sh
        run: |
          if   command -v apt-get >/dev/null; then apt-get update && apt-get install -y git
          elif command -v dnf     >/dev/null; then dnf install -y git
          elif command -v pacman  >/dev/null; then pacman -Sy --noconfirm git
          elif command -v zypper  >/dev/null; then
            out="$( { zypper --non-interactive refresh && zypper --non-interactive install bash git tar gzip; } 2>&1 )" \
              || { echo "::error title=zypper::$(printf '%s' "$out" | tail -25 | tr '\n' '|')"; exit 1; }
          elif command -v apk     >/dev/null; then apk add git bash
          fi
      - uses: actions/checkout@v5
      # Write the whole PATH: in container jobs GITHUB_PATH rebuilds PATH from the image config,
      # and images without a PATH entry (openSUSE Tumbleweed) end up with only ~/.local/bin
      - name: put ~/.local/bin on PATH (steps do not read ~/.bashrc)
        run: echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
        shell: bash
      - name: install.sh
        timeout-minutes: 25
        run: bash install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
        shell: bash -o pipefail {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
      # Reproduces a real failure: a Mason tree-sitter that needs glibc 2.39 shadowing the
      # working one on PATH (old env.sh put Mason first), then re-running the installer
      - name: re-run install.sh with a broken Mason tree-sitter first on PATH
        if: matrix.rerun
        timeout-minutes: 25
        shell: bash -o pipefail {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          M="$HOME/.local/share/nvim/mason"
          mkdir -p "$M/bin" "$M/packages/tree-sitter-cli"
          cp "$HOME/.local/opt/tree-sitter-cli/node_modules/tree-sitter-cli/tree-sitter" "$M/packages/tree-sitter-cli/tree-sitter"
          ln -sf "$M/packages/tree-sitter-cli/tree-sitter" "$M/bin/tree-sitter"
          if "$M/bin/tree-sitter" --version >/dev/null 2>&1; then echo "::warning::planted binary runs here, test is weaker"; fi
          export PATH="$M/bin:$PATH"
          rm -f "$HOME/.local/share/nvim/site/parser/c.so"   # force a parser to compile again
          bash install.sh 2>&1 | tee "$RUNNER_TEMP/install-rerun.log"
          ! grep -q "GLIBC_2.39" "$RUNNER_TEMP/install-rerun.log"
      - name: verify
        run: nvim --headless -c "luafile ci/verify.lua" 2>&1 | tee "$RUNNER_TEMP/verify.log"
        shell: bash -o pipefail {0}
      - name: verify tmux
        run: bash ci/verify-tmux.sh 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
        shell: bash -o pipefail {0}
      - name: report failure
        if: failure() || cancelled()
        run: bash ci/annotate.sh "$RUNNER_TEMP"
        shell: bash

  # A regular user with no sudo: OS packages come from an admin, everything else must land in
  # the user's home. Also checks a second user gets their own, separate tools.
  no-sudo:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 45
    steps:
      - name: admin installs shared OS packages (no sudo in the image)
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates tar gzip xz-utils unzip tmux ripgrep build-essential \
            python3 python3-venv perl clangd procps
          ! command -v sudo
          useradd -m -s /bin/bash alice
          useradd -m -s /bin/bash bob
      - uses: actions/checkout@v5
      - name: install as alice and bob
        timeout-minutes: 40
        shell: bash -o pipefail {0}
        run: |
          for u in alice bob; do
            cp -r "$GITHUB_WORKSPACE" "/home/$u/dotfiles" && chown -R "$u:$u" "/home/$u/dotfiles"
            su - "$u" -c "DOTFILES_DIR=/home/$u/dotfiles bash /home/$u/dotfiles/install.sh" 2>&1 | tee -a "$RUNNER_TEMP/install.log"
          done
      - name: verify as alice
        shell: bash -o pipefail {0}
        run: su - alice -c 'bash -lc "nvim --headless -c \"luafile ~/dotfiles/ci/verify.lua\""' 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: verify tmux as alice
        shell: bash -o pipefail {0}
        run: su - alice -c 'bash ~/dotfiles/ci/verify-tmux.sh' 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
      - name: each user has their own tools
        shell: bash
        run: |
          for u in alice bob; do
            for c in nvim node tree-sitter; do
              p="$(su - "$u" -c "bash -lc 'readlink -f \$(command -v $c)'")"
              echo "$u $c -> $p"
              case "$p" in "/home/$u/"*) ;; *) echo "::error::$u's $c is not in /home/$u: $p"; exit 1 ;; esac
            done
          done
          ! ls /usr/local/bin/nvim /usr/local/bin/tree-sitter 2>/dev/null
      - name: report failure
        if: failure() || cancelled()
        run: bash ci/annotate.sh "$RUNNER_TEMP"
        shell: bash

  # Test the exact command users run (main only, since the short URL serves main)
  one-liner:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Write the whole PATH: in container jobs GITHUB_PATH rebuilds PATH from the image config,
      # and images without a PATH entry (openSUSE Tumbleweed) end up with only ~/.local/bin
      - name: put ~/.local/bin on PATH (steps do not read ~/.bashrc)
        run: echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
        shell: bash
      # Pages deploys install.sh a minute or so after the push; test the version from this commit
      - name: wait until the short URL serves this commit's install.sh
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" -o want.sh
          for i in $(seq 1 40); do
            curl -fsSL "${{ github.repository_owner }}.github.io/dotfiles?t=$(date +%s)" -o got.sh && cmp -s want.sh got.sh && exit 0
            sleep 15
          done
          echo "::error::short URL still serves an older install.sh after 10 min"; exit 1
      - name: curl | bash
        timeout-minutes: 25
        run: curl -fsSL ${{ github.repository_owner }}.github.io/dotfiles | bash 2>&1 | tee "$RUNNER_TEMP/install.log"
        shell: bash -o pipefail {0}
        env:
          DOTFILES_REPO: https://github.com/${{ github.repository }}
      - name: verify
        run: nvim --headless -c "luafile $HOME/dotfiles/ci/verify.lua" 2>&1 | tee "$RUNNER_TEMP/verify.log"
        shell: bash -o pipefail {0}
      - name: verify tmux
        run: bash "$HOME/dotfiles/ci/verify-tmux.sh" 2>&1 | tee "$RUNNER_TEMP/verify-tmux.log"
        shell: bash -o pipefail {0}
      - name: report failure
        if: failure() || cancelled()
        run: bash "$HOME/dotfiles/ci/annotate.sh" "$RUNNER_TEMP"
