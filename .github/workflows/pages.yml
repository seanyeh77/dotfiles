name: pages

# Publishes install.sh at https://seanyeh77.github.io/dotfiles so the install command stays short:
#   curl -fsSL seanyeh77.github.io/dotfiles | bash
on:
  push:
    branches: [main]
    paths: [install.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: build site
        run: |
          mkdir -p _site
          cp install.sh _site/index.html   # served at /dotfiles/
          cp install.sh _site/install.sh   # served at /dotfiles/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: check the short URL serves the current install.sh
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsSL "https://${{ github.repository_owner }}.github.io/dotfiles" -o served.sh && cmp -s served.sh install.sh && exit 0
            sleep 10
          done
          echo "::error::short URL does not serve the current install.sh"; exit 1
