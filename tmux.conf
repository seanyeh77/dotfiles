# ~/.tmux.conf

# Use Ctrl-a as the prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10           # no delay after Esc in nvim
set -g focus-events on          # needed for nvim autoread
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
setw -g mode-keys vi

# Splits and new windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "Reloaded"

# prefix + A: open Claude Code in a split next to the current pane
bind A split-window -h -c "#{pane_current_path}" 'command -v claude >/dev/null && exec claude; echo "claude is not installed (re-run install.sh)"; read -r _'

# Plugins (tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
